# Portfolio manifest -- the single source of truth for the landing page.
#
# To add a project: append one [[project]] entry below and run
#     python scripts/build_portfolio_index.py
# That regenerates the repository tables, dependency graph, test-status list and
# write-up index in README.md (everything between the <!-- BEGIN:* --> markers).
# No hand-editing of those sections is needed, so the page can never drift.
#
# (CI integration in .github/workflows/integration.yml is still updated by hand;
#  only add a project there if it joins the installable dependency chain.)

[meta]
github_user = "afogelis"
# Free-form description used in the landing-page intro. Kept topic-neutral.
tagline = "Index of research projects. Each project is a standalone, installable repository with tests, reproducible outputs, and a paper-style write-up."

# Tiers order the projects within a research area (lower tier number listed first).
[[tier]]
key = "capstone"
title = "Capstones (start here)"
blurb = ""

[[tier]]
key = "foundation"
title = "Foundation and tooling"
blurb = ""

[[tier]]
key = "frontier"
title = "Frontier extensions"
blurb = "Independent, advanced topics that round out the area beyond the basics."

# Research areas group the projects. Add a new [[area]] when you branch into a
# new subject; projects reference it by `area` key.
[[area]]
key = "qec"
name = "Quantum Error Correction"
focus = true
# Area-specific framing rendered under the area heading.
intro = """
**This is:** reproducible research software. It reproduces published results from scratch, implements decoders (union-find, belief propagation, and an exact maximum-likelihood decoder) by hand to study their behavior, and turns physics into decision-ready resource estimates. The engineering is production-grade: typed configs, tests against the real Stim/PyMatching stack, and CI across four Python versions.

**This is not:** a new QEC theory result, a replacement for Stim or PyMatching, or a production decoder stack. The foundational simulator is an *experiment pipeline* built on Stim and PyMatching, not a re-implementation of them. The algorithmic contributions are the **exact maximum-likelihood decoder** (decoder-accuracy-reproduction), which measures how far minimum-weight perfect matching sits from optimal without any Monte Carlo sampling error, and the **from-scratch peeling decoder** (qec-noise-profiles), which reproduces the analytic 0.5 erasure threshold. Engineering trade-offs (including why this is many repos rather than a monorepo) are documented in [`docs/ARCHITECTURE.md`](docs/ARCHITECTURE.md).

Common stack: [Stim](https://github.com/quantumlib/Stim) (stabilizer simulation), [PyMatching](https://pymatching.readthedocs.io/) (MWPM), Pydantic v2 typed configs, pytest, and GitHub Actions CI. Each repo follows the same `src/` layout, RORO interfaces, and MIT license.
"""

